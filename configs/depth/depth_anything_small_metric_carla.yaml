# Depth Anything V2 Small fine-tuned on Virtual KITTI 2: depth in metres (scripts/export_depth_anything.py)
type: depth_anything
model: weights/depth_anything_v2_small_metric_686x518.ts
input_size: [686, 518]
metric: true
