[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perception"
version = "0.1.0"
description = "Camera perception stack: detection, tracking, lanes, depth and distance for CARLA + ROS2"
requires-python = ">=3.10"
# Core only. ML / simulator dependencies live in requirements.txt.
dependencies = ["numpy", "omegaconf>=2.3", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["perception*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# With ROS sourced, Humble's launch_testing plugin (written for pytest 6) breaks pytest 8; not used here
addopts = "-p no:launch_testing -p no:launch_ros"
markers = [
    "gpu: needs a CUDA GPU",
    "carla: needs a running CARLA server",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "ros2_ws/src/perception_ros"]
extend-exclude = ["ros2_ws/build", "ros2_ws/install", "notebooks"]

[tool.ruff.format]
# Python blocks in the design docs are sketches (several fields per line, aligned comments)
exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
# ROS packages; perception_ros has a launch/ folder that would otherwise pass for a first-party module
known-third-party = ["launch", "launch_ros"]
